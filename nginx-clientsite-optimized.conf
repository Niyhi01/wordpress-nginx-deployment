server {
        listen 80;
        root /var/www/clientsite;
        index index.php index.html;
        server_name clientsite.local;

        # Main request routing block
        location / {
                try_files $uri $uri/ /index.php?$args;
        }

        # Dynamic backend handoff block via fast zero-latency Unix sockets
        location ~ \.php$ {
                include snippets/fastcgi-php.conf;
                fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }

        # Isolated error logging metrics for this specific client site
        error_log /var/log/nginx/clientsite_error.log;
        access_log /var/log/nginx/clientsite_access.log;
}
